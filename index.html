<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polar V2</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b1a2b;
    color:white;
    text-align:center;
}

header{
    padding:20px;
    background:#10243a;
}

h1{
    margin:0;
    font-size:32px;
}

nav{
    margin-top:10px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
}

.hero{
    padding:80px 20px;
}

.search-box{
    margin-top:20px;
}

input{
    padding:10px;
    width:250px;
}

button{
    padding:10px 15px;
    border:none;
    cursor:pointer;
    background:#1f6feb;
    color:white;
}

footer{
    position:fixed;
    bottom:0;
    width:100%;
    padding:10px;
    background:#10243a;
    font-size:12px;
}
</style>
</head>

<body>

<header>
    <h1>Polar V2</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Games</a>

</header>

<div class="hero">
    <h2>Welcome</h2>
    <p>Simple. Fast. Clean.</p>

    <div class="search-box">
        <input type="text" placeholder="Search...">
        <button>Go</button>
    </div>
</div>

<footer>
    © 2026 Polar V2
</footer>

</html>
